<app-language-selector
class="spoken-languages lang-tabs"
  [flags]="true"
  [hasLanguageDetection]="false"
  [languages]="translation.signedLanguages"
  [language]="signedLanguage$ | async"
  translationKey="signedLanguagesShort"
  (languageChange)="setSignedLanguage($event)"></app-language-selector>

<ion-button
 class="swap-btn"
  (click)="swapLanguages()"
  id="swap-languages"
  fill="clear"
  expand="full"
  [disabled]="(spokenLanguage$ | async) === null && (detectedLanguage$ | async) === null"
  [matTooltip]="'translate.swapLanguages' | transloco"
  [attr.aria-label]="'translate.swapLanguages' | transloco">
  <ion-icon name="swap-horizontal" class="swap-horizontal"/>
</ion-button>

<app-language-selector
class="signed-languages lang-tabs"
  [hasLanguageDetection]="spokenToSigned"
  [languages]="translation.spokenLanguages"
  [language]="spokenLanguage$ | async"
  translationKey="languages"
  (languageChange)="setSpokenLanguage($event)"></app-language-selector>
  
  <style>

 .lang-tabs {
  display: inline-flex;
}

.lang-tabs ::ng-deep .mdc-tab {
  border: 1px solid #007bff;
  border-radius: 6px;
  padding: 6px 14px;
  margin: 0 4px;
  background: transparent;
  color: #007bff;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lang-tabs ::ng-deep .mdc-tab:hover {
  background: rgba(0, 123, 255, 0.1);
}

.lang-tabs ::ng-deep .mdc-tab--active {
  background: #77a9de73;
  color: #5d5d5d76 !important;
  border-color: #007bff;
}
:host {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative; /* needed for absolute centering */
  width: 100%;
  grid-template-areas: "spoken-languages swap-btn signed-languages";
  grid-template-columns: 2fr 1fr 2fr;
}

.spoken-languages {
  order: 1;
  width: calc(50% - 100px); 
}

.swap-btn {
  order: 2;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: auto !important;   /* overrides expand="full" */
  color: #007bff;
}

.signed-languages {
  order: 3;
  width: calc(50% - 100px); /* Adjusted to match spoken languages */
}

.swap-horizontal {
  font-size: 30px;
}

  </style>
