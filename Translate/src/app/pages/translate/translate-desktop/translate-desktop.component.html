<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="primary">
    </ion-buttons>
    <ion-title>
      <app-logo [text]="'translate.logo' | transloco" />
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <div id="input-mode-group">
      @if (spokenToSigned) {
        <!-- <app-translate-input-button mode="text" icon="text" /> -->
      } @else {
        <app-translate-input-button mode="webcam" icon="videocam" />
        <app-translate-input-button mode="upload" icon="cloud-upload" />
      }
    </div>

    <app-drop-pose-file>
      <div id="translation-card">
        <app-language-selectors />

        <div id="content">
          @if (spokenToSigned) {
            <!-- Spoken to sign requires a text input and video output -->
            <app-spoken-to-signed />
          } @else {
            <!-- Sign to spoken requires a video input and text output -->
            <app-signed-to-spoken />
          }
        </div>
      </div>
    </app-drop-pose-file>
  </div>
</ion-content>


<style>
  .dark-theme {
    --background: #121212; /* dark background */
    color: #ffffff;
  }

  .translator-container {
    display: flex;
    gap: 20px;
    padding: 20px;
    justify-content: center;
  }

  .text-box {
    flex: 1;
    background: #1e1e1e; /* dark card */
    border-radius: 10px;
    padding: 15px;
    color: #ffffff;
    font-size: 1rem;
    border: 1px solid #2a2a2a;
  }

  .lang-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .lang-btn {
    background: transparent;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    color: #aaa;
    font-weight: 500;
    cursor: pointer;
    /* transition: all 0.2s ease-in-out; */
  }

  .lang-btn.active {
    color: #1e90ff;
    border-bottom: 2px solid #1e90ff;
  }

  .swap-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #1e90ff;
  }
</style>
